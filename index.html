<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Dados do Talhão</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #2e7d32;
            max-width: 360px;
            margin: auto;
        }

        h2 {
            margin: 0 0 15px 0;
            color: #2e7d32;
            font-size: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .item {
            margin-bottom: 12px;
            font-size: 15px;
        }

        .label {
            font-weight: 600;
            color: #666;
            display: block;
            font-size: 12px;
            text-transform: uppercase;
        }

        .value {
            color: #111;
            font-size: 16px;
            font-weight: 500;
        }

        .btn {
            display: block;
            margin-top: 15px;
            padding: 12px;
            background: #2e7d32;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            border: none;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
        }

        .btn.disabled {
            background: #ccc;
            pointer-events: none;
        }

        .btn-install {
            background: #1565c0;
            display: none;
        }

        #reader-container {
            margin-top: 20px;
            border-top: 1px dashed #ccc;
            padding-top: 15px;
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            min-height: 250px;
        }

        .btn-scanner {
            background: #37474f;
            margin-bottom: 10px;
        }
    </style>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>
    <div class="card">
        <h2>Dados do Talhão</h2>
        <div class="item"><span class="label">Talhão</span><span class="value" id="t">-</span></div>
        <div class="item"><span class="label">Área do Talhão</span><span class="value" id="a">-</span></div>
        <div class="item"><span class="label">Espécie</span><span class="value" id="e">-</span></div>
        <div class="item"><span class="label">Data de Plantio</span><span class="value" id="p">-</span></div>
        
        <a id="m" href="#" target="_blank" class="btn">Visualizar Mapa (PDF)</a>
        
        <!-- Botão de Instalação do PWA -->
        <button id="btnInstalar" class="btn btn-install">Instalar Aplicativo</button>

        <div id="reader-container">
            <span class="label" style="margin-bottom: 8px;">Scanner de Câmera (Traseira)</span>
            <button id="btnToggleCamera" class="btn btn-scanner">Iniciar Câmera</button>
            <div id="reader"></div>
        </div>
    </div>

    <script>
        // 1. Leitura dos dados do fragmento (#)
        function carregarDados() {
            const hash = window.location.hash.substring(1);
            if (!hash) return;

            const [talhao, area, especie, plantio, mapa] = decodeURIComponent(hash).split('|');

            document.getElementById('t').textContent = talhao || '-';
            document.getElementById('a').textContent = area ? `${area} ha` : '-';
            document.getElementById('e').textContent = especie || '-';
            document.getElementById('p').textContent = plantio || '-';

            const btnMapa = document.getElementById('m');
            if (mapa && mapa !== '#') {
                btnMapa.href = mapa;
                btnMapa.classList.remove('disabled');
            } else {
                btnMapa.href = '#';
                btnMapa.classList.add('disabled');
            }
        }

        window.addEventListener('DOMContentLoaded', carregarDados);
        window.addEventListener('hashchange', carregarDados);

        // 2. Registro do Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker ativo.'))
                .catch((err) => console.log('Erro PWA:', err));
        }

        // 3. Prompt de instalação do PWA
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;

            const btnInstalar = document.getElementById('btnInstalar');
            if (btnInstalar) {
                btnInstalar.style.display = 'block';
                btnInstalar.addEventListener('click', () => {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then(() => { 
                        deferredPrompt = null;
                        btnInstalar.style.display = 'none';
                    });
                });
            }
        });

        // 4. Liberação preventiva de faixas de mídia (Hardware Camera Release)
        async function liberarCameraHardware() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    stream.getTracks().forEach(track => track.stop());
                } catch (e) {
                    // Câmera já liberada ou sem permissão
                }
            }
        }

        // 5. Gerenciamento da Câmera Traseira
        let html5QrCode;
        let isScanning = false;

        async function iniciarCameraTraseira() {
            // Força a liberação prévia de qualquer captura pendente
            await liberarCameraHardware();

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const qrCodeSuccessCallback = (decodedText) => {
                if (decodedText.includes('#')) {
                    window.location.hash = decodedText.split('#')[1];
                    carregarDados();
                } else if (decodedText.includes('|')) {
                    window.location.hash = decodedText;
                    carregarDados();
                }
            };

            const config = { fps: 10, qrbox: { width: 220, height: 220 } };

            try {
                // Tenta abrir com a preferência de câmera traseira
                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    qrCodeSuccessCallback
                );
                isScanning = true;
                document.getElementById('btnToggleCamera').textContent = "Parar Câmera";
            } catch (err) {
                console.error("Erro ao abrir câmera traseira:", err);
                
                // Trata especificamente o NotReadableError orientando o usuário
                if (err.toString().includes("NotReadableError") || err.name === "NotReadableError") {
                    alert("A câmera está sendo usada por outra aba/aplicativo.\n\nPor favor, feche a aba antiga do navegador e tente novamente.");
                } else {
                    alert("Não foi possível acessar a câmera traseira. Verifique as permissões.");
                }
            }
        }

        async function pararCamera() {
            if (html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                } catch (e) {
                    console.log("Erro ao parar câmera:", e);
                }
                isScanning = false;
                document.getElementById('btnToggleCamera').textContent = "Iniciar Câmera";
            }
        }

        document.getElementById('btnToggleCamera').addEventListener('click', () => {
            if (isScanning) {
                pararCamera();
            } else {
                iniciarCameraTraseira();
            }
        });

        // Para a câmera se a pessoa minimizar o app ou trocar de aba
        window.addEventListener('visibilitychange', () => {
            if (document.hidden && isScanning) {
                pararCamera();
            }
        });

        window.addEventListener('pagehide', pararCamera);
    </script>
</body>

</html>
