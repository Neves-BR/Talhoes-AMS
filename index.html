<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Dados do Talhão</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #2e7d32;
            max-width: 360px;
            margin: auto;
        }

        h2 {
            margin: 0 0 15px 0;
            color: #2e7d32;
            font-size: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .item {
            margin-bottom: 12px;
            font-size: 15px;
        }

        .label {
            font-weight: 600;
            color: #666;
            display: block;
            font-size: 12px;
            text-transform: uppercase;
        }

        .value {
            color: #111;
            font-size: 16px;
            font-weight: 500;
        }

        .btn {
            display: block;
            margin-top: 15px;
            padding: 12px;
            background: #2e7d32;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            border: none;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
        }

        .btn.disabled {
            background: #ccc;
            pointer-events: none;
        }

        .btn-install {
            background: #1565c0;
            display: none; /* Exibido apenas se o navegador permitir a instalação */
        }

        #reader-container {
            margin-top: 20px;
            border-top: 1px dashed #ccc;
            padding-top: 15px;
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
    <!-- Para garantir o funcionamento offline, salve a biblioteca html5-qrcode.min.js na mesma pasta -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>
    <div class="card">
        <h2>Dados do Talhão</h2>
        <div class="item"><span class="label">Talhão</span><span class="value" id="t">-</span></div>
        <div class="item"><span class="label">Área do Talhão</span><span class="value" id="a">-</span></div>
        <div class="item"><span class="label">Espécie</span><span class="value" id="e">-</span></div>
        <div class="item"><span class="label">Data de Plantio</span><span class="value" id="p">-</span></div>
        
        <a id="m" href="#" target="_blank" class="btn">Visualizar Mapa (PDF)</a>
        
        <!-- Botão para instalar o PWA na tela inicial / área de trabalho -->
        <button id="btnInstalar" class="btn btn-install">Instalar Aplicativo</button>

        <div id="reader-container">
            <span class="label" style="margin-bottom: 8px;">Escanear QR Code</span>
            <div id="reader"></div>
        </div>
    </div>

    <script>
        // 1. Leitura dos dados do fragmento (#)
        function carregarDados() {
            const hash = window.location.hash.substring(1);
            if (!hash) return;

            const [talhao, area, especie, plantio, mapa] = decodeURIComponent(hash).split('|');

            document.getElementById('t').textContent = talhao || '-';
            document.getElementById('a').textContent = area ? `${area} ha` : '-';
            document.getElementById('e').textContent = especie || '-';
            document.getElementById('p').textContent = plantio || '-';

            const btnMapa = document.getElementById('m');
            if (mapa && mapa !== '#') {
                btnMapa.href = mapa;
                btnMapa.classList.remove('disabled');
            } else {
                btnMapa.href = '#';
                btnMapa.classList.add('disabled');
            }
        }

        window.addEventListener('DOMContentLoaded', carregarDados);
        window.addEventListener('hashchange', carregarDados);

        // 2. Registro do Service Worker via arquivo externo (necessário para o PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker registrado com sucesso.'))
                .catch((err) => console.log('Erro ao registrar Service Worker:', err));
        }

        // 3. Gerenciamento do prompt de instalação (PWA)
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;

            const btnInstalar = document.getElementById('btnInstalar');
            if (btnInstalar) {
                btnInstalar.style.display = 'block';
                btnInstalar.addEventListener('click', () => {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then(() => { 
                        deferredPrompt = null;
                        btnInstalar.style.display = 'none';
                    });
                });
            }
        });

        // 4. Inicialização do Leitor de QR Code
        function onScanSuccess(decodedText) {
            if (decodedText.includes('#')) {
                window.location.hash = decodedText.split('#')[1];
                carregarDados();
            }
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: { width: 200, height: 200 } },
            /* verbose= */ false
        );

        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>

</html>
